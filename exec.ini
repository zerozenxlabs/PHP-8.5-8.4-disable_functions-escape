; no-exec.ini
; Disable system/command execution functions for PHP CLI

disable_functions = "exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,proc_nice"

; Optional: also block related dangerous functions
; disable_classes = "DirectoryIterator,FilesystemIterator,GlobIterator"

; Optional: prevent ini_set() from re-enabling anything at runtime
; (disable_functions is PHP_INI_SYSTEM by default, so ini_set() can't change it anyway)

; Optional hardening
allow_url_fopen = Off
allow_url_include = Off
expose_php = Off
